; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp8285]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
monitor_filters =
	esp8266_exception_decoder
	time
lib_deps =
	paulstoffregen/Time@^1.6.1
	z01ne/MyAlarm@^1.1.2
	https://github.com/thijse/Arduino-Log.git#3f4fcf5a345c1d542e56b88c0ffcb2bd2a5b0bd0
	fmtlib/fmt@^8.1.1
build_flags =
	-Isrc/logger
	-DDISABLE_LOGGING
	-DSERIAL_SWAP ; UART0 RX on GPIO13 (D7); onboard GPIO3 input is dead
board_build.ldscript = eagle.flash.2m128.ld
board_build.filesystem = littlefs

[env:esp8285_factoryreset]
extends = env:esp8285
build_flags =
	-Isrc/logger
	-DDISABLE_LOGGING
	-DSERIAL_SWAP
	-DRESET_SETTINGS

[env:espmxdevkit]
platform = espressif8266
board = espmxdevkit
framework = arduino
; build_type = debug
monitor_speed = 115200
monitor_filters =
	esp8266_exception_decoder
	time
; 	default   ; Remove typical terminal control codes from input
;   log2file  ; Log data to a file “platformio-device-monitor-*.log” located in the current working directory
lib_deps =
	paulstoffregen/Time@^1.6.1
	z01ne/MyAlarm@^1.1.2
	# thijse/ArduinoLog@^1.1.1
	https://github.com/thijse/Arduino-Log.git#3f4fcf5a345c1d542e56b88c0ffcb2bd2a5b0bd0
	fmtlib/fmt@^8.1.1
build_flags =
	-Isrc/logger
	-Isrc/mocks
	-DDEBUG=2

[env:test]
platform = native
build_type = test
build_flags =
	-Isrc
	-Itest/support
	-Wno-missing-template-arg-list-after-template-kw
	-Wno-deprecated-literal-operator
lib_deps =
	throwtheswitch/Unity@^2.5.2
	fabiobatsilva/ArduinoFake@^0.4.0
test_build_src = no
